name: Enhanced Radar
description: Enhanced Radar is a San Francisco-based applied AI company building intelligent
  systems for aviation, the world's most complex transportation domain. Its work centers on
  pilot-controller communications, where the company owns the full pipeline from data collection
  through in-house labeling and quality assurance to produce high-quality aviation AI training
  datasets. Products include Pattern, an aviation operational intelligence platform; ATC.com, a
  live air traffic control radio service; and Y4, an aviation understanding model announced in
  February 2026. Enhanced Radar has demonstrated real-time detection of runway incursion risks and
  raised $7 million in May 2026. It is backed by DCVC and Initialized Capital. The company does not
  currently publish a public API, developer documentation, or SDKs.
